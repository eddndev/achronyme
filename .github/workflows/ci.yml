name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Ensure a Rust toolchain is on PATH
        uses: ./.github/actions/setup-rust

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: self-hosted
    concurrency:
      group: ci-test-self-hosted
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Ensure a Rust toolchain is on PATH
        uses: ./.github/actions/setup-rust

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Doctests
        run: cargo test --doc --workspace

      - name: Integration tests
        run: bash test/run_tests.sh

  llvm:
    name: LLVM 21 JIT and AOT
    runs-on: self-hosted
    concurrency:
      group: ci-llvm-self-hosted
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Ensure a Rust toolchain is on PATH
        uses: ./.github/actions/setup-rust

      - name: Verify LLVM toolchain
        run: |
          test "$(uname -s)" = "Linux"
          case "$(uname -m)" in
            x86_64|aarch64) ;;
            *) echo "::error::Unsupported LLVM host architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          clang-21 --version | sed -n '1p' | grep -E '^clang version 21\.'
          clang --version | sed -n '1p' | grep -E '^clang version 21\.'

      - name: Build AOT runtimes
        run: |
          cargo build -p akron-aot-runtime
          cargo build -p akron-aot-runtime --release

      - name: Verify release panic contract
        run: bash test/release_panic_contract.sh

      - name: Test LLVM backend
        run: cargo test -p akron-llvm --features llvm,aot

      - name: Test LLVM CLI engines
        run: >-
          cargo test -p cli --features llvm
          --test llvm_engine_test
          --test engine_oracle
          --test aot_cli_test
