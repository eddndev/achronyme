name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, feat/llvm-experimental]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Ensure a Rust toolchain is on PATH
        uses: ./.github/actions/setup-rust

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: self-hosted
    concurrency:
      group: ci-test-self-hosted
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Ensure a Rust toolchain is on PATH
        uses: ./.github/actions/setup-rust

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Doctests
        run: cargo test --doc --workspace

      - name: Integration tests
        run: bash test/run_tests.sh

  llvm:
    name: LLVM 21 JIT and AOT
    runs-on: self-hosted
    concurrency:
      group: ci-llvm-self-hosted
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Ensure a Rust toolchain is on PATH
        uses: ./.github/actions/setup-rust

      - name: Verify LLVM toolchain
        run: |
          test "$(uname -s)" = "Linux"
          case "$(uname -m)" in
            x86_64|aarch64) ;;
            *) echo "::error::Unsupported LLVM host architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          clang_path=""
          for candidate in clang-21 clang; do
            candidate_path="$(command -v "$candidate" || true)"
            if [ -z "$candidate_path" ]; then
              continue
            fi
            version="$($candidate_path --version | sed -n '1p')"
            major="$(printf '%s\n' "$version" | sed -n 's/.*clang version \([0-9][0-9]*\).*/\1/p')"
            if [ "$major" = "21" ]; then
              clang_path="$candidate_path"
              break
            fi
            echo "::notice::Ignoring $candidate_path: $version"
          done
          if [ -z "$clang_path" ]; then
            echo "::error::No Clang 21 executable found as clang-21 or clang" >&2
            exit 1
          fi
          llvm_tools="$RUNNER_TEMP/akron-llvm-tools"
          mkdir -p "$llvm_tools"
          ln -s "$clang_path" "$llvm_tools/clang"
          echo "$llvm_tools" >> "$GITHUB_PATH"
          "$llvm_tools/clang" --version | sed -n '1p'

      - name: Build AOT runtimes
        run: |
          cargo build -p akron-aot-runtime
          cargo build -p akron-aot-runtime --release

      - name: Verify release panic contract
        run: bash test/release_panic_contract.sh

      - name: Verify LLVM link contract
        run: bash test/llvm_link_contract.sh

      - name: Verify interpreter-only CLI
        run: |
          cargo test -p cli --no-default-features --lib
          cargo test -p cli --no-default-features \
            --test default_feature_contract \
            --test engine_feature_gate_test

      - name: Test LLVM backend
        run: cargo test -p akron-llvm --features llvm,aot

      - name: Test LLVM CLI engines
        run: >-
          cargo test -p cli
          --test llvm_engine_test
          --test engine_oracle
          --test aot_cli_test
